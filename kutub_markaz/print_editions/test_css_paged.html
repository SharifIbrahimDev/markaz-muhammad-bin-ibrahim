<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Test Paged Media</title>
  <style>
    @page {
      size: A4;
      margin: 25mm 16mm 22mm 16mm;
      @top-right {
        content: "«عُنْوَانُ الكِتَابِ التَّجْرِيبِيِّ»";
        font-family: serif;
        font-size: 9pt;
        color: #1E3A8A;
        border-bottom: 1px solid #C5A059;
      }
      @top-left {
        content: "شَرْحُ الشَّيْخِ";
        font-family: serif;
        font-size: 9pt;
        color: #4B5563;
        border-bottom: 1px solid #C5A059;
      }
      @bottom-center {
        content: "— " counter(page) " —";
        font-family: serif;
        font-size: 10pt;
        color: #854D0E;
        font-weight: bold;
      }
    }
    @page :first {
      margin: 15mm 16mm 15mm 16mm;
      @top-right { content: none; }
      @top-left { content: none; }
      @bottom-center { content: none; }
    }
    body {
      font-family: serif;
      font-size: 16pt;
      line-height: 2;
    }
    .cover {
      height: 90vh;
      border: 4px double #C5A059;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      page-break-after: always;
      break-after: page;
    }
  </style>
</head>
<body>
  <div class="cover">
    <h1>هَذَا شَافِعُ الغِلَافِ (الصَّفْحَةُ الأُولَى)</h1>
    <p>يَجِبُ أَلَّا يَظْهَرَ فَوْقَهُ هِيدَرْ وَلَا فُوتَرْ</p>
  </div>
  <div>
    <h2>الصَّفْحَةُ الثَّانِيَةُ</h2>
    <p>هَذِهِ الصَّفْحَةُ الثَّانِيَةُ يَجِبُ أَنْ يَظْهَرَ فَوْقَهَا الهِيدَرْ وَتَحْتَهَا الفُوتَرْ مَعَ رَقْمِ الصَّفْحَةِ 2.</p>
  </div>
</body>
</html>
